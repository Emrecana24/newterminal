name: APK Derle

on:
  workflow_dispatch:      # Actions sekmesi > "APK Derle" > "Run workflow"

permissions:
  contents: write         # Release oluşturmak için

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK adını düzenle
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CodespaceTerminal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CodespaceTerminal-apk
          path: CodespaceTerminal.apk

      # Telefondan tek dokunuşla indirmek için Releases sayfasına da koyar
      - name: Release oluştur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v2.${{ github.run_number }}" CodespaceTerminal.apk \
            --title "Codespace Terminal v2.${{ github.run_number }}" \
            --notes "Derleme #${{ github.run_number }}" --latest
